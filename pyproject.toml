[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vice-clip-factory"
version = "0.1.1"
description = "Rights-aware local gameplay highlights and multi-account publishing queue"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10"]

[project.scripts]
viceclip = "viceclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
